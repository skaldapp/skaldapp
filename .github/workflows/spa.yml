name: spa
on:
  push:
    tags:
      - v*.*.*
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: |
          cd src-electron
          npm ci
          cd ..
          npm ci
          npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/spa/
          include-hidden-files: true
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v5
